schema_version: 1
computers:
  drive_uno:
    serial_by_id: /dev/serial/by-id/CHANGE_ME_DRIVE_UNO
    baudrate: 115200
  terrain_uno:
    serial_by_id: /dev/serial/by-id/CHANGE_ME_TERRAIN_UNO
    baudrate: 115200
  gps:
    device: /dev/serial0
    baudrate: 115200
crosswalk:
  data_file: raspberry_pi/standard_crosswalks.json
  api_key_file: /etc/safestride/signal_api_key.txt
  intersection_id: CHANGE_ME_ITST_ID
  motion_output_enabled: false
drive:
  requires_explicit_ros_enable: false
  wheel_radius_m: 0.115
  wheel_separation_m: 0.55
  # Current twelve-pulse left-wheel preset. Change this and both runtime
  # configs together if the installed pulse count changes.
  hall_pulses_per_revolution: 12
  hall_calibrated: true
  hall_sensor_layout: single_left
  pressure:
    left_pressed_threshold: 80
    right_pressed_threshold: 80
    left_active_high: true
    right_active_high: true
terrain:
  tof:
    interface: I2C
    address_7bit: 0x52
    mount_height_m: 0.25
    mount_pitch_deg: null
  imu:
    module: GY-521 MPU6050
    address_7bit: 0x68
perception:
  model_path: models/road_surface.onnx
  model_sha256: CHANGE_ME
  confidence_threshold: 0.65
  # Unknown/degraded perception is advisory and must not request a stop.
  unknown_speed_scale: 1.0
monitoring:
  # Set these true only after the corresponding electrical telemetry exists.
  motor_driver_fault_input_available: false
  pressure_disconnect_detection_available: false
  independent_motor_feedback_available: false
  battery_monitoring_available: false
  battery_nominal_voltage_v: 12.0
  battery_nominal_capacity_ah: 0.0
  converter_monitoring_available: false
  converter_nominal_input_v: 12.0
  converter_nominal_output_v: 5.0
