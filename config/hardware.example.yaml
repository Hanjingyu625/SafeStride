schema_version: 1
computers:
  drive_uno:
    serial_by_id: /dev/serial/by-id/CHANGE_ME_DRIVE_UNO
    baudrate: 115200
  terrain_uno:
    serial_by_id: /dev/serial/by-id/CHANGE_ME_TERRAIN_UNO
    baudrate: 115200
crosswalk:
  data_file: data/generated/standard_crosswalks.json
  api_key_file: /etc/safestride/signal_api_key.txt
  intersection_id: CHANGE_ME_ITST_ID
  motion_output_enabled: false
drive:
  requires_explicit_ros_enable: true
  wheel_radius_m: 0.15
  wheel_separation_m: 0.55
  # Current six-magnet left-wheel preset. Use 5 here and in both runtime
  # configs if five magnets are installed on the sensed wheel.
  hall_pulses_per_revolution: 6
  hall_calibrated: true
  hall_sensor_layout: single_left
  pressure:
    left_pressed_threshold: 25
    right_pressed_threshold: 25
    left_active_high: true
    right_active_high: true
terrain:
  gps:
    module: BE-220
    uno_rx_pin: D8
    uno_tx_pin: D9
    baudrate: 9600
    note: Configure the module to 9600 baud before normal operation.
  tof:
    interface: I2C
    address_7bit: 0x52
    mount_height_m: 0.25
    mount_pitch_deg: null
  imu:
    module: GY-521 MPU6050
    address_7bit: 0x68
perception:
  model_path: models/road_surface.onnx
  model_sha256: CHANGE_ME
  confidence_threshold: 0.65
  unknown_speed_scale: 0.0
