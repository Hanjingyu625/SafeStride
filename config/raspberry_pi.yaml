serial_bridge:
  ros__parameters:
    serial:
      port: /dev/safestride-drive
      baudrate: 115200
      read_chunk_size: 256
      max_frame_size: 160
      reconnect_period_s: 1.0
    transport: {poll_rate_hz: 200.0}
    command:
      publish_rate_hz: 50.0
      timeout_s: 0.20
      ttl_ms: 200
      arm_max_wheel_speed_rad_s: 0.10
      max_abs_angular_z_rad_s: 0.0
      # Temporary lifted-wheel open-loop drive until an encoder is selected,
      # implemented and calibrated. Set true for production operation.
      require_encoder_feedback: false
      arm_confirmation_timeout_s: 1.0
    telemetry: {timeout_s: 0.30}
    diagnostics: {publish_rate_hz: 1.0}
    base:
      max_wheel_speed_rad_s: 3.0
    range: {min_m: 0.02, max_m: 4.0, field_of_view_rad: 0.35}
    battery: {empty_voltage: 0.0, full_voltage: 0.0}
    frames:
      odom: odom
      base: base_footprint
      range_left: front_left_range_link
      range_right: front_right_range_link
    joints: {left: left_wheel_joint, right: right_wheel_joint}
    topics:
      cmd_vel: /cmd_vel_safe
      joint_states: /joint_states
      odom: /odom
      range_left: /range/front_left
      range_right: /range/front_right
      battery: /battery_state
      pressure: /handle/pressure
      encoder: /wheel/encoder
      status: /walker/status
      diagnostics: /diagnostics
    services: {set_enabled: /walker/set_enabled}
    publish_tf: true

terrain_bridge:
  ros__parameters:
    serial:
      port: /dev/safestride-terrain
      baudrate: 115200
      read_chunk_size: 256
      max_frame_size: 160
      reconnect_period_s: 1.0
    transport: {poll_rate_hz: 100.0}
    telemetry: {timeout_s: 0.30}
    gps: {enabled: true, timeout_s: 2.0}
    diagnostics: {publish_rate_hz: 1.0}
    range: {min_m: 0.10, max_m: 2.0, field_of_view_rad: 0.052}
    frames: {tof: terrain_tof_link, gps: gps_link}
    topics:
      tof: /terrain/tof
      gps_fix: /gps/fix
      gps_speed: /gps/speed
      status: /terrain/status
      diagnostics: /diagnostics

safety_supervisor:
  ros__parameters:
    publish_rate: 20.0
    diagnostic_rate: 2.0
    command_timeout: 0.25
    status_timeout: 0.50
    max_telemetry_age: 0.50
    range_timeout: 0.35
    surface_timeout: 2.5
    # The terrain TOF faces downward and cannot replace front obstacle ranges.
    require_range_sensors: false
    # launch overrides this to true whenever surface perception is enabled.
    require_surface_condition: false
    require_deadman: true
    max_forward_velocity: 0.15
    max_reverse_velocity: 0.08
    max_angular_velocity: 0.0
    max_surface_speed_scale: 1.25
    max_linear_acceleration: 0.20
    max_linear_deceleration: 0.50
    max_angular_acceleration: 0.50
    max_angular_deceleration: 1.00
    stop_distance: 0.35
    slow_distance: 0.80
    command_topic: /cmd_vel
    safe_command_topic: /cmd_vel_safe
    left_range_topic: /range/front_left
    right_range_topic: /range/front_right
    surface_topic: /perception/surface_condition
    status_topic: /walker/status
    diagnostics_topic: /diagnostics
    output_frame_id: base_link

cruise_command:
  ros__parameters:
    speed_mps: 0.08
    publish_rate_hz: 20.0
    command_topic: /cmd_vel
    frame_id: base_link

surface_perception:
  ros__parameters:
    camera:
      index: 0
      backend: v4l2
      width: 640
      height: 480
      reconnect_period_s: 2.0
    model:
      path: ''
      classes_path: ''
      confidence_threshold: 0.65
      ema_alpha: 0.75
      version: ''
    inference_rate_hz: 1.0
    diagnostic_rate_hz: 1.0
    surface_topic: /perception/surface_condition
    diagnostics_topic: /diagnostics
    frame_id: camera_link

gps_node:
  ros__parameters:
    # Optional direct-to-Pi fallback. Do not start alongside Terrain Uno GPS.
    port: /dev/serial/by-id/CHANGE_ME_BE220
    baudrate: 115200
    poll_rate_hz: 50.0
    reconnect_period_s: 1.0
    frame_id: gps_link
    fix_topic: /gps/fix
    speed_topic: /gps/speed

crosswalk_controller:
  ros__parameters:
    crosswalk_file: /home/CHANGE_ME/SafeStride/data/generated/standard_crosswalks.json
    api_key_file: /etc/safestride/signal_api_key.txt
    # Set this manually unless each crosswalk JSON record contains itstId.
    intersection_id: ''
    update_rate_hz: 5.0
    gps_timeout_s: 2.0
    speed_timeout_s: 1.0
    signal_refresh_interval_s: 3.0
    signal_cache_max_age_s: 12.0
    signal_request_timeout_s: 3.0
    maximum_crosswalk_distance_m: 80.0
    default_safe_speed_mps: 0.50
    profile_file: ''
    # Enable only after logged Pi-only tests and lifted-wheel validation.
    motion_output_enabled: false
    fix_topic: /gps/fix
    gps_speed_topic: /gps/speed
    odom_topic: /odom
    command_topic: /cmd_vel
    status_topic: /crosswalk/status
    diagnostics_topic: /diagnostics
    output_frame_id: base_link
