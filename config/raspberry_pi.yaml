serial_bridge:
  ros__parameters:
    serial:
      port: /dev/safestride-drive
      baudrate: 115200
      read_chunk_size: 256
      max_frame_size: 160
      reconnect_period_s: 1.0
    transport: {poll_rate_hz: 200.0}
    command:
      publish_rate_hz: 50.0
      timeout_s: 0.20
      ttl_ms: 200
      deadman_direct_drive: true
      deadman_forward_velocity_m_s: 0.10
      max_abs_angular_z_rad_s: 0.0
      allow_magnet_bench_mode: false
      auto_arm_magnet_bench_mode: false
    telemetry: {timeout_s: 0.30}
    diagnostics: {publish_rate_hz: 1.0}
    base:
      hall_pulses_per_revolution: 6
      max_wheel_speed_rad_s: 3.0
    range: {min_m: 0.02, max_m: 4.0, field_of_view_rad: 0.35}
    # Nominal pack voltage is known, but no battery-to-ADC divider is fitted.
    battery: {nominal_voltage: 12.0, empty_voltage: 0.0, full_voltage: 0.0}
    frames:
      odom: odom
      base: base_footprint
      range_left: front_left_range_link
      range_right: front_right_range_link
    joints: {left: left_wheel_joint, right: right_wheel_joint}
    topics:
      cmd_vel: /cmd_vel_safe
      joint_states: /joint_states
      odom: /odom
      range_left: /range/front_left
      range_right: /range/front_right
      battery: /battery_state
      pressure: /handle/pressure
      hall: /wheel/hall
      status: /walker/status
      diagnostics: /diagnostics
    services: {set_enabled: /walker/set_enabled}
    publish_tf: true

terrain_bridge:
  ros__parameters:
    serial:
      port: /dev/safestride-terrain
      baudrate: 115200
      read_chunk_size: 256
      max_frame_size: 160
      reconnect_period_s: 1.0
    transport: {poll_rate_hz: 100.0}
    telemetry: {timeout_s: 0.30}
    diagnostics: {publish_rate_hz: 1.0}
    range: {min_m: 0.10, max_m: 2.0, field_of_view_rad: 0.052}
    frames: {tof: terrain_tof_link, imu: imu_link}
    topics:
      tof: /terrain/tof
      imu: /terrain/imu
      status: /terrain/status
      diagnostics: /diagnostics

safety_supervisor:
  ros__parameters:
    publish_rate: 20.0
    diagnostic_rate: 2.0
    command_timeout: 0.25
    status_timeout: 0.50
    max_telemetry_age: 0.50
    range_timeout: 0.35
    # This now requires the downward TOF terrain status, not front-facing range.
    require_range_sensors: true
    require_deadman: true
    max_forward_velocity: 0.15
    max_reverse_velocity: 0.08
    max_angular_velocity: 0.0
    max_linear_acceleration: 0.20
    max_linear_deceleration: 0.50
    max_angular_acceleration: 0.50
    max_angular_deceleration: 1.00
    stop_distance: 0.35
    slow_distance: 0.80
    command_topic: /cmd_vel
    safe_command_topic: /cmd_vel_safe
    left_range_topic: /range/front_left
    right_range_topic: /range/front_right
    status_topic: /walker/status
    terrain_status_topic: /terrain/status
    diagnostics_topic: /diagnostics
    output_frame_id: base_link

cruise_command:
  ros__parameters:
    speed_mps: 0.08
    publish_rate_hz: 20.0
    command_topic: /cmd_vel
    frame_id: base_link

surface_perception:
  ros__parameters:
    camera:
      index: 0
      backend: v4l2
      width: 640
      height: 480
      reconnect_period_s: 2.0
    model:
      path: ''
      classes_path: ''
      confidence_threshold: 0.65
      min_top1_margin: 0.15
      ema_alpha: 0.75
      cpu_threads: 1
      version: ''
    inference_rate_hz: 1.0
    diagnostic_rate_hz: 1.0
    surface_topic: /perception/surface_condition
    diagnostics_topic: /diagnostics
    frame_id: camera_link

gps_node:
  ros__parameters:
    # BE-220 is connected directly to the Raspberry Pi, not the Terrain Uno.
    port: /dev/serial0
    baudrate: 115200
    poll_rate_hz: 50.0
    reconnect_period_s: 1.0
    frame_id: gps_link
    fix_topic: /gps/fix
    speed_topic: /gps/speed
    course_topic: /gps/course
    diagnostics_topic: /diagnostics
    nmea_timeout_s: 2.0
    fix_timeout_s: 2.0
    diagnostic_rate_hz: 1.0
    course_min_speed_mps: 0.20

crosswalk_controller:
  ros__parameters:
    # Empty files keep the node in readiness-monitor mode without crashing.
    crosswalk_file: ''
    api_key_file: ''
    # Optional bench fallback. Live GPS/V2X matching takes priority.
    intersection_id: ''
    intersection_map_page_size: 100
    intersection_map_max_pages: 30
    intersection_map_retry_s: 60.0
    intersection_map_file: ''
    intersection_map_cache_file: ~/.cache/safestride/v2x_intersections.json
    maximum_intersection_distance_m: 120.0
    update_rate_hz: 5.0
    gps_timeout_s: 2.0
    speed_timeout_s: 1.0
    heading_timeout_s: 5.0
    heading_min_move_m: 2.0
    heading_max_step_m: 30.0
    candidate_heading_tolerance_deg: 60.0
    gps_change_threshold_m: 0.5
    gps_stuck_timeout_s: 5.0
    gps_stuck_speed_mps: 0.15
    signal_refresh_interval_s: 3.0
    signal_cache_max_age_s: 12.0
    signal_request_timeout_s: 3.0
    maximum_crosswalk_distance_m: 80.0
    default_safe_speed_mps: 0.50
    profile_file: ''
    # Enable only after logged Pi-only tests and lifted-wheel validation.
    motion_output_enabled: false
    fix_topic: /gps/fix
    gps_speed_topic: /gps/speed
    gps_course_topic: /gps/course
    odom_topic: /odom
    command_topic: /cmd_vel
    status_topic: /crosswalk/status
    diagnostics_topic: /diagnostics
    output_frame_id: base_link

foxglove_bridge:
  ros__parameters:
    port: 8765
    address: 0.0.0.0
    topic_whitelist:
      - ^/(diagnostics|walker/status|wheel/hall|handle/pressure|battery_state)$
      - ^/terrain/(tof|imu|status)$
      - ^/(gps/fix|gps/speed|gps/course|crosswalk/status|odom|tf|tf_static|robot_description)$
    service_whitelist: ['(?!)']
    param_whitelist: ['(?!)']
    client_topic_whitelist: ['(?!)']
    capabilities: [connectionGraph, assets]
    sysinfo: true
