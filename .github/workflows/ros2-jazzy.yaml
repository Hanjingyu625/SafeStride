name: ROS 2 Jazzy

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y build-essential python3-colcon-common-extensions python3-pytest python3-serial
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y --rosdistro jazzy
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+
      - name: Test
        shell: bash
        run: |
          bash -n scripts/*.sh
          python3 -m unittest test/test_hardware_integrity.py
          bash scripts/test_firmware.sh
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
